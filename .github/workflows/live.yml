name: Minute live collector
on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Run an eight-minute handoff rehearsal, then launch a normal successor'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * 10,11 *'
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish fresh snapshots every minute
        env:
          ELECTION_PUBLIC_STATE_URL: ${{ vars.ELECTION_PUBLIC_STATE_URL }}
          ELECTION_PUBLISH_TOKEN: ${{ secrets.ELECTION_PUBLISH_TOKEN }}
          ELECTION_DATA_DIR: ${{ runner.temp }}/election-live
          COLLECTOR_MINUTES: ${{ inputs.rehearsal && '8' || '345' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python live_collector.py
