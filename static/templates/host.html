<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Watch — Host Panel</title>
  <link rel="stylesheet" href="/static/css/tv.css">
  <style>
    body { background: #0a0f14; color: #e8edf3; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; padding: 24px; overflow-y: auto; }
    #host-panel { position: static; display: flex; flex-direction: column; overflow: visible; background: #0a0f14; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div id="host-panel" class="open" style="position:fixed; inset:0; background:#0a0f14; z-index:50; display:flex; flex-direction:column; overflow-y:auto; padding:24px;">
    <div class="panel">
      <div class="panel-header">Election Watch — Host Control Panel</div>
      <button id="host-close" class="tv-button">Close Host Panel</button>
    </div>
    <div class="panel" style="margin-top:14px;">
      <div class="panel-header">Host Controls</div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <button id="host-enter-fullscreen" class="tv-button">Enter Fullscreen</button>
        <button id="host-exit-fullscreen" class="tv-button">Exit Fullscreen</button>
        <button id="host-toggle-ticker" class="tv-button">Toggle Ticker</button>
        <button id="host-check-now" class="tv-button">Check Now</button>
        <button id="host-rotate" class="tv-button">Auto-Rotate</button>
        <button id="host-manual-next" class="tv-button">Next View</button>
        <button id="host-manual-prev" class="tv-button">Previous View</button>
      </div>
      <div class="panel-header">Text Size</div>
      <div style="display:flex; gap:12px; margin-bottom:16px;">
        <button id="host-text-decrease" class="tv-button">A−</button>
        <button id="host-text-increase" class="tv-button">A+</button>
      </div>
      <div class="panel-header">Current View</div>
      <div id="host-current-view" style="font-size:28px; font-weight:600;">National</div>
    </div>
    <div class="panel" style="margin-top:14px;">
      <div class="panel-header">Diagnostics &amp; Detailed Status</div>
      <div id="host-diagnostics"></div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
