<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Election Watch · TV</title><link rel="stylesheet" href="/static/css/tv.css"><script defer src="/static/js/candidate-profiles.js"></script><script defer src="/static/js/night.js"></script><script defer src="/static/js/power.js"></script><script defer src="/static/js/history.js"></script><script defer src="/static/js/app.js"></script></head>
<body><div id="tv-root">
 <header><div class="brand">ELECTION<span>WATCH</span></div><div class="date">NOVEMBER 3, 2026<span>USA / FLORIDA / INDIAN RIVER</span></div><time id="clock"></time><div class="tools"><button id="pause" title="Pause rotation (Space)">Pause</button><button id="fullscreen" title="Fullscreen (F)">Fullscreen</button><a href="/host" target="_blank" rel="noopener">Host controls</a></div></header>
 <div id="mode-banner" role="status">Connecting to dashboard…</div>
 <div id="freshness-bar" aria-label="Data freshness"></div><nav aria-label="Dashboard views"><button data-view="national">National</button><button data-view="power">Power</button><button data-view="florida">Florida</button><button data-view="indian_river">Indian River</button><button data-view="watchlist">Watchlist</button><button data-view="comparisons">Polls &amp; markets</button><button data-view="history">History</button><button data-view="night">Night desk</button><button data-view="health">Source health</button></nav>
 <main id="main" tabindex="-1"><div class="empty"><h1>Election Watch</h1><p>Loading the latest saved snapshot…</p></div></main>
 <div id="page-controls"><span id="view-caption"></span><span><button id="previous-page" aria-label="Previous page">Previous page</button><span id="page-label"></span><button id="next-page" aria-label="Next page">Next page</button></span><span id="rotation-status"></span></div>
 <aside id="ticker" aria-label="Election updates"><strong id="ticker-label">UPDATES</strong><div id="ticker-content" aria-live="off"></div><span id="ticker-time"></span><button id="ticker-pause" aria-label="Pause ticker">Pause ticker</button></aside>
 <footer><span id="connection">Connecting…</span><span id="source-summary"></span><span id="checked">Not checked yet</span></footer>
</div><dialog id="details"><button id="close-details">Close</button><div id="details-content"></div></dialog><div id="toast" role="status"></div></body></html>
